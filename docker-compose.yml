version: '3.8'

services:
  agent-service:
    build: .
    container_name: agent-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # 挂载本地向量库和记忆库（确保容器重启数据不丢失）
      - D:/faiss_store:/app/faiss_store
      - D:/faiss_memory_store:/app/faiss_memory_store
      - D:/agent_memory.sqlite:/app/agent_memory.sqlite

      # 挂载 HuggingFace 模型缓存（避免每次重启重新下载模型）
      - C:/Users/XH/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped